services:
  - type: web
    name: modelforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CONTROL_PLANE_MODE
        value: demo
      - key: DOMAINFORGE_URL
        value: https://domainforge-api.onrender.com
      - key: LLM_GATEWAY_URL
        value: https://aegis-llm-gateway-api.onrender.com
