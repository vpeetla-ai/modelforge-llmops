name: ModelForge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test FastAPI package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q

  next-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Next.js (UI + /api routes)
        run: |
          npm ci
          npm run build
      - name: Sanity — receipts present for honesty path
        run: |
          test -f public/receipts/peft_smoke.json
          test -f public/receipts/gateway_routing_sample.json
          test -f public/receipts/slm_bakeoff.md
          # GPU/CUDA receipts must NOT be claimed by accidental empty stubs
          test ! -f public/receipts/peft_gpu.json
          test ! -f public/receipts/vllm_cuda.json
