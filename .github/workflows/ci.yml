name: ModelForge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test FastAPI package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pytest -q

  next-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Next.js (UI + /api routes)
        run: |
          npm ci
          npm run build
      - name: Sanity — receipts present for honesty path
        run: |
          test -f public/receipts/peft_smoke.json
          test -f public/receipts/gateway_routing_sample.json
          test -f public/receipts/slm_bakeoff.md
      - name: Validate receipt honesty gates
        working-directory: .
        run: |
          # --require-gpu: real CUDA PEFT + upstream vLLM receipts have been published
          # (see docs/receipts/peft_gpu.json / vllm_cuda.json, run_ids peft-20260824T005657Z
          # and vllm-20260824T011254Z). This is now a positive requirement, not just a
          # 'don't fake it' guard -- validate_receipts.py already checks status=gpu,
          # cuda=true, non-tiny base_model, and real ttft/tok_per_s metrics.
          python3 scripts/validate_receipts.py --require-gpu
