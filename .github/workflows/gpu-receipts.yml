name: GPU receipts (self-hosted)

# Runs only when a self-hosted runner labeled [self-hosted, gpu] is registered.
# Does not invent receipts on ubuntu-latest (no CUDA).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "peft-only | vllm-only | both"
        required: true
        default: both
        type: choice
        options: [peft-only, vllm-only, both]

jobs:
  cuda-receipts:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      # clean:false is load-bearing on this self-hosted runner: a real run lost an
      # entire completed training pass (378-example SFT + 16-pair DPO, ~30min GPU
      # time) because this step's default `git clean -ffdx` wipes ANY untracked
      # content in the workspace -- including the DomainForge sibling checkout
      # below, which lives inside this same directory (github.workspace). A later
      # mode=vllm-only run, despite skipping the DomainForge checkout step itself,
      # still ran this top-level checkout first and silently deleted the prior
      # run's adapters/ + training_manifest.json before anyone could read them.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Assert CUDA
        run: |
          nvidia-smi
          python3 -c "import torch; assert torch.cuda.is_available(), 'no CUDA'"

      - name: Checkout DomainForge sibling
        if: ${{ inputs.mode == 'peft-only' || inputs.mode == 'both' }}
        uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/domainforge-rag-peft
          path: domainforge-rag-peft
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: PEFT GPU receipt (DomainForge)
        if: ${{ inputs.mode == 'peft-only' || inputs.mode == 'both' }}
        env:
          DOMAINFORGE_ROOT: ${{ github.workspace }}/domainforge-rag-peft
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GPU_SKU: ${{ vars.GPU_SKU }}
          # PyTorch's own suggested mitigation for the SFT->DPO OOM: real run
          # showed "21.84 GiB memory in use" on a 22GB L4 with PyTorch's error
          # itself naming fragmentation as the cause. Belt-and-suspenders on
          # top of the explicit gc.collect()/empty_cache() between stages.
          PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
        run: |
          set -euo pipefail
          MF="${{ github.workspace }}"
          DF="$DOMAINFORGE_ROOT"
          SKU="${GPU_SKU:-self-hosted-cuda}"
          mkdir -p "$MF/docs/receipts" "$MF/ui/public/receipts"
          SMI_LOG="$MF/docs/receipts/_nvidia_smi.txt"
          nvidia-smi | tee "$SMI_LOG"
          cd "$DF"
          # DomainForge's training stack (torch<2.5.0, transformers<4.46.0, trl<0.10.0)
          # was pinned for Python 3.11 and predates Python 3.13 wheel availability for
          # those versions. The runner's system Python is whatever the host ships
          # (3.13 on Debian trixie) -- use a uv-managed Python 3.11 venv instead of
          # loosening those pins blind, since newer transformers/trl have known
          # breaking API changes that would risk silently changing training behavior.
          "$HOME/.local/bin/uv" venv --python 3.11 --seed .venv-gpu
          source .venv-gpu/bin/activate
          python3 -m pip install -U pip -q
          pip install -e ".[train,train-gpu]" -q
          bash scripts/gpu_pipeline.sh
          # Real training config/timing comes from each stage's own training_manifest.json
          # (written by train_qlora()/train_dpo() next to the adapter weights) -- NOT from
          # data/eval/results/s3*.json / s4*.json. Those are committed fixtures that
          # domainforge-eval compare never overwrites (it only ever scores S0/S1/S2), so
          # reading them here would silently attach stale, unrelated numbers to this run's
          # adapter. See export_modelforge_receipt.py's own docstring for the full story.
          SFT_MANIFEST=$(ls adapters/domainforge-triage-v0/training_manifest.json 2>/dev/null || ls adapters/*/training_manifest.json 2>/dev/null | grep -v dpo | head -1)
          DPO_MANIFEST=$(ls adapters/domainforge-triage-dpo-v0/training_manifest.json 2>/dev/null || ls adapters/*dpo*/training_manifest.json 2>/dev/null | head -1)
          ADAPTER=$(ls -d adapters/domainforge-triage-dpo-v0 2>/dev/null || ls -d adapters/*dpo* 2>/dev/null | head -1 || true)
          python3 scripts/export_modelforge_receipt.py \
            --sft-manifest "$SFT_MANIFEST" --dpo-manifest "$DPO_MANIFEST" \
            --adapter-uri "${ADAPTER:-adapters/domainforge-triage-dpo-v0}" \
            --gpu "$SKU" \
            --require-cuda \
            --nvidia-smi-log "$SMI_LOG" \
            --out "$MF/docs/receipts/peft_gpu.json"
          cp "$MF/docs/receipts/peft_gpu.json" "$MF/ui/public/receipts/peft_gpu.json"

      - name: Upstream vLLM CUDA metrics
        if: ${{ inputs.mode == 'vllm-only' || inputs.mode == 'both' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GPU_SKU: ${{ vars.GPU_SKU }}
        run: |
          set -euo pipefail
          MF="${{ github.workspace }}"
          SKU="${GPU_SKU:-self-hosted-cuda}"
          mkdir -p "$MF/docs/receipts" "$MF/ui/public/receipts"
          SMI_LOG="$MF/docs/receipts/_nvidia_smi.txt"
          nvidia-smi | tee "$SMI_LOG"
          cd "$MF"
          docker compose -f docker-compose.vllm.yml up -d
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then ok=1; break; fi
            sleep 10
          done
          [[ "$ok" == "1" ]] || { docker compose -f docker-compose.vllm.yml logs --tail=80; exit 1; }
          # torch is already present system-wide (the "Assert CUDA" step above
          # imports it successfully) but httpx is not -- this step never had
          # its own dependency install, unlike the PEFT step's dedicated venv.
          python3 -m pip install --break-system-packages -q httpx
          python3 scripts/capture_vllm_metrics.py \
            --base-url http://127.0.0.1:8000 \
            --gpu "$SKU" \
            --require-cuda \
            --nvidia-smi-log "$SMI_LOG"
          cp "$MF/docs/receipts/vllm_cuda.json" "$MF/ui/public/receipts/vllm_cuda.json"

      - name: Validate DoD receipts
        run: |
          if [[ "${{ inputs.mode }}" == "both" ]]; then
            make check-dod
          else
            python3 scripts/validate_receipts.py
          fi

      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-gpu-receipts
          path: |
            docs/receipts/peft_gpu.json
            docs/receipts/vllm_cuda.json
            ui/public/receipts/peft_gpu.json
            ui/public/receipts/vllm_cuda.json
          if-no-files-found: warn
